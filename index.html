<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sukee Tea Time</title>

  <!-- Open Graph / social sharing -->
  <meta property="og:site_name" content="Sukee Tea Time">
  <meta property="og:type" content="article">
  <meta property="og:title" id="ogTitle" content="Sukee Tea Time">
  <meta property="og:description" id="ogDescription" content="Reflections on life, wellness, and everyday moments.">
  <meta property="og:url" id="ogUrl" content="">
  <meta property="og:image" id="ogImage" content="">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" id="twTitle" content="Sukee Tea Time">
  <meta name="twitter:description" id="twDescription" content="Reflections on life, wellness, and everyday moments.">
  <meta name="twitter:image" id="twImage" content="">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lora:ital,wght@0,400;0,500;1,400&family=Noto+Sans+SC:wght@400;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header -->
  <header>
    <button class="hamburger" id="hamburgerBtn" aria-label="Menu">&#9776;</button>
    <span class="site-name">Sukee Tea Time</span>
    <button class="lang-toggle" id="langToggle" aria-label="Switch language">中文</button>
    <button class="speaker-btn" id="speakerBtn" aria-label="Read article aloud">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
        <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
      </svg>
    </button>
    <a class="tea-chat-btn" href="https://talk.sukeeteatime.com/" target="_blank" rel="noopener" aria-label="Open Tea Chat">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 8h1a4 4 0 0 1 0 8h-1"/>
        <path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V8z"/>
        <line x1="6" y1="2" x2="6" y2="5"/>
        <line x1="10" y1="2" x2="10" y2="5"/>
        <line x1="14" y1="2" x2="14" y2="5"/>
      </svg>
    </a>
  </header>

  <!-- Sidebar -->
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <span class="sidebar-head-title">Sukee Tea Time</span>
      <button class="sidebar-close" id="sidebarClose">✕</button>
    </div>
    <div class="sidebar-body">
      <div class="sidebar-label" id="sidebarBrowseLabel">Browse</div>
      <ul class="sidebar-nav" id="sidebarNav"></ul>
      <div class="sidebar-divider"></div>
    </div>
  </aside>

  <!-- Main search -->
  <div class="main-search-wrap">
    <svg class="main-search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="search" id="mainSearch" class="main-search-input" placeholder="Search articles…" autocomplete="off" autocorrect="off" spellcheck="false">
    <button class="main-search-clear" id="mainSearchClear" style="display:none">✕</button>
  </div>

  <!-- Calendar -->
  <div class="calendar-widget" id="calendarWidget"></div>

  <!-- Main feed -->
  <main id="blogFeed"></main>

  <footer>
    <p>Sukee Tea Time</p>
  </footer>

  <!-- Listen Dialog -->
  <div class="dialog-overlay" id="listenOverlay">
    <div class="listen-dialog">
      <span class="dialog-icon">🎧</span>
      <h2 id="listenDialogTitle">Listen Mode</h2>
      <p id="listenDialogSubtitle">Pick categories and duration for your session.</p>
      <div class="cat-filter-label" id="listenCatLabel">Categories</div>
      <div class="cat-filter-chips" id="catFilterChips"></div>
      <div class="cat-filter-label" id="listenContentLbl">Reading Language</div>
      <div class="time-opts" id="listenLangOpts">
        <button class="time-opt active" data-lang="en">English</button>
        <button class="time-opt" data-lang="zh">Chinese</button>
        <button class="time-opt" data-lang="mix">Mix</button>
      </div>
      <div class="cat-filter-label" id="listenDurLabel">Session length</div>
      <div class="time-opts">
        <button class="time-opt active" data-min="10">10 min</button>
        <button class="time-opt" data-min="15">15 min</button>
        <button class="time-opt" data-min="30">30 min</button>
      </div>
      <button class="btn-start" id="startListenBtn">▶ Start Listening</button>
      <button class="btn-cancel" id="cancelListenBtn">Cancel</button>
    </div>
  </div>

  <!-- Mini Player -->
  <div class="mini-player" id="miniPlayer">
    <div class="mp-info">
      <span class="mp-label" id="mpLabel">🎧 Now Reading</span>
      <div class="mp-title" id="mpTitle">—</div>
      <div class="mp-progress"><div class="mp-bar" id="mpBar"></div></div>
    </div>
    <div class="mp-controls">
      <button class="mp-btn" id="mpPause">⏸</button>
      <button class="mp-btn mp-skip" id="mpSkip">⏭ Skip</button>
      <button class="mp-btn" id="mpStop">■ Stop</button>
    </div>
  </div>

  <!-- Article Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-gold-bar"></div>
      <div class="modal-inner">
        <div class="modal-cat" id="modalCategory"></div>
        <h2 class="modal-title" id="modalTitle"></h2>
        <div class="modal-byline" id="modalByline"></div>
        <div class="modal-tags-row" id="modalTags"></div>
        <hr class="modal-divider">
        <div class="modal-body" id="modalContent"></div>
      </div>
      <!-- Home button: placed AFTER modal-inner so it sits above the iOS scroll layer -->
      <a class="modal-close" id="modalClose" href="https://talk.sukeeteatime.com/" target="_blank" rel="noopener" aria-label="Open Sukee Tea Time">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      </a>
      <!-- Session controls bar — shown only during timed reading -->
      <div class="session-bar" id="sessionBar" style="display:none">
        <div class="session-bar-progress"><div class="session-bar-fill" id="sessionBarFill"></div></div>
        <div class="session-bar-body">
          <span class="session-bar-track" id="sessionBarTrack"></span>
          <div class="session-bar-controls">
            <button class="sb-btn" id="sbPause">⏸</button>
            <button class="sb-btn sb-skip" id="sbSkip">⏭ Next</button>
            <button class="sb-btn sb-stop" id="sbStop">■ Stop</button>
          </div>
        </div>
      </div>
    </div>
  </div>


  <!-- All posts bundled into one file by the pre-commit hook (was 365 separate requests) -->
  <script src="blogs/registry.js?v=11" defer></script>
  <script src="blogs-ch/registry.js?v=11" defer></script>
  <script src="app.js?v=11" defer></script>

</body>
</html>
