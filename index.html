<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sukee Tea Time</title>

  <!-- Open Graph / social sharing -->
  <meta property="og:site_name" content="Sukee Tea Time">
  <meta property="og:type" content="article">
  <meta property="og:title" id="ogTitle" content="Sukee Tea Time">
  <meta property="og:description" id="ogDescription" content="Reflections on life, wellness, and everyday moments.">
  <meta property="og:url" id="ogUrl" content="">
  <meta property="og:image" id="ogImage" content="">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" id="twTitle" content="Sukee Tea Time">
  <meta name="twitter:description" id="twDescription" content="Reflections on life, wellness, and everyday moments.">
  <meta name="twitter:image" id="twImage" content="">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lora:ital,wght@0,400;0,500;1,400&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header -->
  <header>
    <button class="hamburger" id="hamburgerBtn" aria-label="Menu">&#9776;</button>
    <span class="site-name">Sukee Tea Time</span>
    <button class="speaker-btn" id="speakerBtn" aria-label="Read article aloud">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
        <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
      </svg>
    </button>
  </header>

  <!-- Sidebar -->
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <span class="sidebar-head-title">Sukee Tea Time</span>
      <button class="sidebar-close" id="sidebarClose">✕</button>
    </div>
    <div class="sidebar-body">
      <div class="sidebar-search-wrap">
        <svg class="sidebar-search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="search" id="sidebarSearch" class="sidebar-search-input" placeholder="Search articles…" autocomplete="off" autocorrect="off" spellcheck="false">
        <button class="sidebar-search-clear" id="sidebarSearchClear" style="display:none">✕</button>
      </div>
      <div class="sidebar-label" id="sidebarBrowseLabel">Browse</div>
      <ul class="sidebar-nav" id="sidebarNav"></ul>
      <div class="sidebar-divider"></div>
    </div>
  </aside>

  <!-- Calendar -->
  <div class="calendar-widget" id="calendarWidget"></div>

  <!-- Main feed -->
  <main id="blogFeed"></main>

  <footer>
    <p>Sukee Tea Time</p>
  </footer>

  <!-- Listen Dialog -->
  <div class="dialog-overlay" id="listenOverlay">
    <div class="listen-dialog">
      <span class="dialog-icon">🎧</span>
      <h2>Listen Mode</h2>
      <p>Pick categories and duration for your session.</p>
      <div class="cat-filter-label">Categories</div>
      <div class="cat-filter-chips" id="catFilterChips"></div>
      <div class="cat-filter-label">Session length</div>
      <div class="time-opts">
        <button class="time-opt active" data-min="10">10 min</button>
        <button class="time-opt" data-min="15">15 min</button>
        <button class="time-opt" data-min="30">30 min</button>
      </div>
      <button class="btn-start" id="startListenBtn">▶ Start Listening</button>
      <button class="btn-cancel" id="cancelListenBtn">Cancel</button>
    </div>
  </div>

  <!-- Mini Player -->
  <div class="mini-player" id="miniPlayer">
    <div class="mp-info">
      <span class="mp-label">🎧 Now Reading</span>
      <div class="mp-title" id="mpTitle">—</div>
      <div class="mp-progress"><div class="mp-bar" id="mpBar"></div></div>
    </div>
    <div class="mp-controls">
      <button class="mp-btn" id="mpPause">⏸</button>
      <button class="mp-btn mp-skip" id="mpSkip">⏭ Skip</button>
      <button class="mp-btn" id="mpStop">■ Stop</button>
    </div>
  </div>

  <!-- Article Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-gold-bar"></div>
      <div class="modal-inner">
        <button class="modal-close" id="modalClose">✕</button>
        <div class="modal-cat" id="modalCategory"></div>
        <h2 class="modal-title" id="modalTitle"></h2>
        <div class="modal-byline" id="modalByline"></div>
        <button class="modal-listen-btn" id="modalListenBtn">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
          Listen
        </button>
        <hr class="modal-divider">
        <div id="modalTags"></div>
        <div class="modal-body" id="modalContent"></div>
      </div>
    </div>
  </div>


  <!-- All posts bundled into one file by the pre-commit hook (was 365 separate requests) -->
  <script src="blogs/registry.js" defer></script>
  <script src="app.js" defer></script>

</body>
</html>
